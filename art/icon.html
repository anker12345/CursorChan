<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  .tile {
    position: absolute; left: 40px; top: 40px; width: 944px; height: 944px; border-radius: 220px;
    background: linear-gradient(160deg, #8B7CF6 0%, #6C8CFF 55%, #4FB3FF 100%);
    box-shadow: inset 0 -24px 60px rgba(30, 20, 90, .25), inset 0 20px 40px rgba(255, 255, 255, .25);
    overflow: hidden;
  }
  .glow { position: absolute; width: 700px; height: 700px; left: 160px; top: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%); }
  img { position: absolute; width: 1000px; height: 1000px; left: 0px; top: 30px; }
</style></head>
<body>
  <div class="tile"><div class="glow"></div></div>
  <img src="mascot-icon.svg">
</body></html>
